name: check-rulesets

on:
  schedule:
    - cron: "0 2 * * 1"   # 每周一 02:00 UTC，盯上游规则集有没有再拆文件
  push:
    paths:
      - "ss/shadowrocket.conf"
      - "clash/proxy-transformer.js"
      - "*/rules/**"
      - "scripts/check-rulesets.py"
      - ".github/workflows/check-rulesets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/check-rulesets.py
