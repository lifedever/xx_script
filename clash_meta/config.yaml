    filter: "^(?!.*(台湾|Taiwan|TW|香港|Hong Kong|HK|🇭🇰|新加坡|Singapore|🇸🇬|日本|Japan|🇯🇵|美国|USA|🇺🇸|韩国|Korea|KR|🇰🇷)).*$"
