#---------------------------------------------------#
# 路由规则
#---------------------------------------------------#
rules:
  # 内网 IP 直连（最高优先级）
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

  # 公司域名直连
  - DOMAIN-SUFFIX,manyibar.cn,DIRECT
  - DOMAIN-SUFFIX,manyibar.com,DIRECT
  - DOMAIN-SUFFIX,manyiba.com,DIRECT
  - DOMAIN-SUFFIX,kanasinfo.cn,DIRECT

  # Notion
  - RULE-SET,notion,📝 Notion

  # 私有网络直连
  - RULE-SET,my_private,DIRECT
  - RULE-SET,private,DIRECT

  # Apple 直连
  - RULE-SET,apple,DIRECT

  # AI 服务
  - RULE-SET,my_ai,🤖 AI
  - RULE-SET,bing,🤖 AI
  - RULE-SET,copilot,🤖 AI
  - RULE-SET,bard,🤖 AI
  - RULE-SET,openai,🤖 AI
  - RULE-SET,claude,🤖 AI

  # 自定义代理
  - RULE-SET,my_proxy,🚀 代理

  # Steam / Cloudflare
  - RULE-SET,steam,🚀 代理
  - RULE-SET,cloudflare,🚀 代理

  # Telegram
  - RULE-SET,telegram_domain,✈️ 电报
  - RULE-SET,telegram_ip,✈️ 电报

  # Google
  - RULE-SET,google_domain,🔍 谷歌
  - RULE-SET,google_ip,🔍 谷歌

  # Microsoft
  - RULE-SET,microsoft_domain,🪟 微软
  - RULE-SET,microsoft,🪟 微软

  # 非中国域名走代理
  - RULE-SET,geolocation-!cn,🚀 代理

  # 中国域名和IP直连
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT

  # 兜底规则
  - MATCH,🐟 兜底
